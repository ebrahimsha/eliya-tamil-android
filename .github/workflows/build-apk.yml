
name: Build Eliya Tamil APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK type to build
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        if: github.event_name == 'push' || inputs.build_type == 'debug'
        run: gradle --no-daemon assembleDebug

      - name: Decode release keystore
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ELIYA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/eliya-release.jks"
          echo "ELIYA_KEYSTORE_PATH=$RUNNER_TEMP/eliya-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        env:
          ELIYA_KEYSTORE_PASSWORD: ${{ secrets.ELIYA_KEYSTORE_PASSWORD }}
          ELIYA_KEY_ALIAS: ${{ secrets.ELIYA_KEY_ALIAS }}
          ELIYA_KEY_PASSWORD: ${{ secrets.ELIYA_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Upload debug APK
        if: github.event_name == 'push' || inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: eliya-tamil-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: eliya-tamil-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
